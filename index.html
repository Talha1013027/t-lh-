<!DOCTYPE html>

<html>
<head>
  <meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <link rel="stylesheet" href="style.css"/>
  <title>Yazılılar web</title>
  <style>
  
  </style>
</head>
<body>
  <button class="geri" id="geri" onclick="geri()">geri</button>
  <div id="1ders">
  <br>
  <button class="ders" onclick="bmat()">matematik</button>
  <br>
  <button class="ders" onclick="bfen()">   fen   </button>
  <br>
  <button class="ders" onclick="bing()">   ing   </button>
  <br>
  <button class="ders" onclick="bdin()">   din   </button>
  <br>
  <button class="ders" onclick="btürk()"> türkçe </button>
  <br>
  <button class="ders" onclick="diğer()">diğer</button>
  </div>
  <div class="yazılı" id="myazılı">
    <button class="ders" onclick="matematik()">Matematik</button>
    <button class="ders sno" onclick="Seçmelimatematik ve b.()">Seçmeli matematik ve b. </button>
  </div>
  <div class="yazılı" id="fyazılı">
    <button class="ders sno"onclick="fen()">fen</button>
    <button class="ders sno"onclick="Seçmelifen()">Seçmeli fen </button>
  </div>
  <div class="yazılı" id="iyazılı">
    <button class="ders"onclick="ingilizce()">ingilizce</button>
    <button class="ders sno"onclick="ikonuşma()">konuşma</button>
    <button class="ders sno"onclick="idinleme()">dinleme</button>
  </div>
  <div class="yazılı" id="dyazılı">
    <button class="ders"onclick="din()">din</button>
    <button class="ders"onclick="siyer()">siyer</button>
    <button class="ders sno"onclick="tdb()">tdb</button>
    <button class="ders"onclick="kuran()">kuran</button>
    <button class="ders sno"onclick="arapça()">arapça</button>
  </div>
  <div class="yazılı" id="tyazılı">
    <button class="ders"onclick="türkçe()">türkçe</button>
    <button class="ders sno"onclick="tdinleme()">dinleme</button>
    <button class="ders sno"onclick="tkonuşma()">konuşma</button>
  </div>
  
  <div class="diğer" id="diğer">
    <button class="ders" id="yate" onclick="yate()">yazılı tarihleri</button>
    <button class="ders" id="dp" onclick="dp()">ders programı</button>
  </div>
  
  <script>
  function geri() {
    document.getElementById('diğer').style.display = 'none';
    document.getElementById('myazılı').style.display = 'none';
    document.getElementById('fyazılı').style.display = 'none';
    document.getElementById('dyazılı').style.display = 'none';
    document.getElementById('iyazılı').style.display = 'none';
    document.getElementById('tyazılı').style.display = 'none';
    document.getElementById('1ders').style.display = 'block';
    document.getElementById('geri').style.display = 'none';
  }
  function bmat() {
    document.getElementById('myazılı').style.display = 'block';
    document.getElementById('1ders').style.display = 'none';
    document.getElementById('geri').style.display = 'block';
  }
  function bfen() {
    document.getElementById('fyazılı').style.display = 'block';
    document.getElementById('1ders').style.display = 'none';
    document.getElementById('geri').style.display = 'block';
  }
  
  function bing() {
    document.getElementById('iyazılı').style.display = 'block';
    document.getElementById('1ders').style.display = 'none';
    document.getElementById('geri').style.display = 'block';
  }
  
  function bdin() {
    document.getElementById('dyazılı').style.display = 'block';
    document.getElementById('1ders').style.display = 'none';
    document.getElementById('geri').style.display = 'block';
  }
  
  function btürk() {
    document.getElementById('tyazılı').style.display = 'block';
    document.getElementById('1ders').style.display = 'none';
    document.getElementById('geri').style.display = 'block';
  }
  
  function diğer() {
    document.getElementById('1ders').style.display = 'none';
    document.getElementById('geri').style.display = 'block';
    document.getElementById('diğer').style.display = 'block';
  }
  
  function ikonuşma() {
window.open('ikonuşma.pdf', '_blank');
  }
  
  function matematik() {
window.open('matematik.jpg', '_blank');
  }
  
    function türkçe() {
window.open('türkçe.jpg', '_blank');
  }
  
  function ingilizce() {
window.open('ingilizce.jpg', '_blank');
  }
  
  function kuran() {
window.open('kuran.jpg', '_blank');
  }
  
    function siyer() {
window.open('siyer.jpg', '_blank');
  }
  
  function din() {
window.open('din.jpg', '_blank');
  }
  
  
  function dp() {
window.open('dp.jpg', '_blank');
  }
  
  function yate() {
window.open('yate.jpg', '_blank');
  }
  
  document.querySelectorAll('.sno').forEach(buton => {
  buton.addEventListener('click', () => {
    alert("daha henüz net bir senaryo yok!");
  });
});
  
  
  </script>
</body>
</html>
